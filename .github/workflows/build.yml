name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o jahiz-tv.zip -d _src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: _src/jahiz-tv
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp _src/jahiz-tv/app/build/outputs/apk/debug/app-debug.apk out/jahiz.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jahiz-apk
          path: out/jahiz.apk
          if-no-files-found: error
